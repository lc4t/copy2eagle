<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clipboard Watcher</title>
  <style>
    :root {
      --cw-bg: #ffffff;
      --cw-fg: #1a1a1a;
      --cw-muted: #6b6b6b;
      --cw-border: #e6e6e6;
      --cw-card: #fafafa;
      --cw-primary: #1677ff;
      --cw-success: #52c41a;
      --cw-idle: #d9d9d9;
      --cw-error: #ff4d4f;
      --cw-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    [data-theme="dark"] {
      --cw-bg: #1f1f1f;
      --cw-fg: #f1f1f1;
      --cw-muted: #9a9a9a;
      --cw-border: #2e2e2e;
      --cw-card: #262626;
      --cw-primary: #4096ff;
      --cw-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--cw-bg);
      color: var(--cw-fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .cw-app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px 18px;
    }
    .cw-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .cw-header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .cw-header .cw-version {
      font-size: 11px;
      color: var(--cw-muted);
    }
    .cw-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--cw-card);
      border: 1px solid var(--cw-border);
      border-radius: 8px;
    }
    .cw-status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cw-idle);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.03);
    }
    .cw-dot[data-status="running"]  { background: var(--cw-success); }
    .cw-dot[data-status="idle"]     { background: var(--cw-idle); }
    .cw-dot[data-status="error"]    { background: var(--cw-error); }
    .cw-status-text { font-weight: 500; }
    .cw-status-count {
      font-size: 12px;
      color: var(--cw-muted);
    }
    .cw-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cw-field label {
      font-size: 12px;
      color: var(--cw-muted);
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--cw-bg);
      color: var(--cw-fg);
      border: 1px solid var(--cw-border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--cw-primary);
    }
    .cw-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--cw-card);
      border: 1px solid var(--cw-border);
      border-radius: 8px;
    }
    .cw-toggle-row .cw-toggle-label {
      font-weight: 500;
    }
    .cw-switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 38px;
    }
    .cw-switch input { display: none; }
    .cw-switch .cw-slider {
      position: absolute;
      inset: 0;
      background: var(--cw-idle);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .cw-switch .cw-slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .cw-switch input:checked + .cw-slider { background: var(--cw-primary); }
    .cw-switch input:checked + .cw-slider::before { transform: translateX(16px); }
    .cw-switch input:disabled + .cw-slider { cursor: not-allowed; opacity: 0.5; }
    .cw-recent-empty {
      color: var(--cw-muted);
      font-size: 12px;
      padding: 12px;
      text-align: center;
      border: 1px dashed var(--cw-border);
      border-radius: 6px;
    }
    .cw-advanced summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--cw-muted);
      padding: 4px 0;
      user-select: none;
    }
    .cw-advanced summary::-webkit-details-marker { display: none; }
    .cw-advanced summary::before {
      content: "▶ ";
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .cw-advanced[open] summary::before {
      transform: rotate(90deg);
    }
    .cw-advanced-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 10px;
    }
    .cw-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cw-row > input[type="text"] { flex: 1; }
    .cw-button {
      padding: 7px 12px;
      background: var(--cw-bg);
      color: var(--cw-fg);
      border: 1px solid var(--cw-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .cw-button:hover { border-color: var(--cw-primary); }
    .cw-primary-button {
      width: 100%;
      padding: 10px 12px;
      background: var(--cw-primary);
      color: #ffffff;
      border: 1px solid var(--cw-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .cw-primary-button:hover:not(:disabled) { opacity: 0.9; }
    .cw-primary-button:disabled {
      background: var(--cw-idle);
      border-color: var(--cw-idle);
      color: var(--cw-muted);
      cursor: not-allowed;
    }
    .cw-slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cw-slider-row input[type="range"] {
      flex: 1;
    }
    .cw-slider-row .cw-slider-value {
      font-size: 12px;
      color: var(--cw-muted);
      min-width: 56px;
      text-align: right;
    }
    .cw-radio-group {
      display: flex;
      gap: 14px;
    }
    .cw-radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--cw-fg);
      font-size: 13px;
    }
    .cw-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-error-banner {
      display: none;
      padding: 8px 10px;
      background: rgba(255, 77, 79, 0.08);
      color: var(--cw-error);
      border: 1px solid rgba(255, 77, 79, 0.3);
      border-radius: 6px;
      font-size: 12px;
    }
    .cw-error-banner[data-visible="true"] { display: block; }
    .cw-hint {
      font-size: 11px;
      color: var(--cw-muted);
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <main class="cw-app">
    <header class="cw-header">
      <h1>Clipboard Watcher</h1>
      <span class="cw-version" id="cw-version">v1.0.0</span>
    </header>

    <section class="cw-status">
      <div class="cw-status-left">
        <span class="cw-dot" id="cw-status-dot" data-status="idle"></span>
        <span class="cw-status-text" id="cw-status-text">已停止</span>
      </div>
      <span class="cw-status-count" id="cw-status-count">今日导入：0</span>
    </section>

    <div class="cw-error-banner" id="cw-error-banner"></div>

    <section class="cw-field">
      <label for="cw-folder">目标文件夹</label>
      <select id="cw-folder">
        <option value="">请选择文件夹…</option>
      </select>
      <span class="cw-hint" id="cw-folder-hint">未选择文件夹时无法开启监听</span>
    </section>

    <section class="cw-toggle-row">
      <span class="cw-toggle-label">开启监听</span>
      <label class="cw-switch">
        <input type="checkbox" id="cw-enabled" disabled />
        <span class="cw-slider"></span>
      </label>
    </section>

    <section>
      <button type="button" class="cw-primary-button" id="cw-screenshot" disabled>
        立即截图（到剪贴板）
      </button>
      <span class="cw-hint" id="cw-screenshot-hint">
        macOS：选区截图直接进剪贴板 · Windows：请用 Win+Shift+S
      </span>
    </section>

    <section class="cw-field">
      <label>最近导入</label>
      <div class="cw-recent-empty" id="cw-recent">尚无导入记录</div>
    </section>

    <details class="cw-advanced" id="cw-advanced">
      <summary>高级设置</summary>
      <div class="cw-advanced-body">
        <div class="cw-field">
          <label for="cw-interval">监听间隔</label>
          <div class="cw-slider-row">
            <input type="range" id="cw-interval" min="500" max="5000" step="100" value="1000" />
            <span class="cw-slider-value" id="cw-interval-value">1000 ms</span>
          </div>
        </div>

        <div class="cw-field">
          <label for="cw-tags">自动添加标签（逗号分隔）</label>
          <input type="text" id="cw-tags" placeholder="clipboard-watcher" />
        </div>

        <div class="cw-field">
          <label>重复图片处理</label>
          <div class="cw-radio-group">
            <label>
              <input type="radio" name="cw-duplicate" value="skip" checked />
              跳过（默认）
            </label>
            <label>
              <input type="radio" name="cw-duplicate" value="allow" />
              允许重复
            </label>
          </div>
          <span class="cw-hint">「跳过」时，目标文件夹已存在的图不会重复导入</span>
        </div>

        <div class="cw-checkbox-row">
          <input type="checkbox" id="cw-notify" checked />
          <label for="cw-notify">导入成功时发送通知</label>
        </div>
      </div>
    </details>
  </main>

  <script src="js/plugin.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
