<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>剪贴板图片留存</title>
  <style>
    :root {
      --cw-bg: #ffffff;
      --cw-fg: #1a1a1a;
      --cw-muted: #6b6b6b;
      --cw-border: #e6e6e6;
      --cw-card: #fafafa;
      --cw-primary: #1677ff;
      --cw-success: #52c41a;
      --cw-idle: #d9d9d9;
      --cw-error: #ff4d4f;
      --cw-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    [data-theme="dark"] {
      --cw-bg: #1f1f1f;
      --cw-fg: #f1f1f1;
      --cw-muted: #9a9a9a;
      --cw-border: #2e2e2e;
      --cw-card: #262626;
      --cw-primary: #4096ff;
      --cw-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--cw-bg);
      color: var(--cw-fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .cw-app {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px 18px;
    }
    .cw-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .cw-header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    .cw-header .cw-version {
      font-size: 11px;
      color: var(--cw-muted);
    }
    .cw-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--cw-card);
      border: 1px solid var(--cw-border);
      border-radius: 8px;
    }
    .cw-status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cw-idle);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.03);
    }
    .cw-dot[data-status="running"]  { background: var(--cw-success); }
    .cw-dot[data-status="idle"]     { background: var(--cw-idle); }
    .cw-dot[data-status="error"]    { background: var(--cw-error); }
    .cw-status-text { font-weight: 500; }
    .cw-status-count {
      font-size: 12px;
      color: var(--cw-muted);
    }
    .cw-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cw-field label {
      font-size: 12px;
      color: var(--cw-muted);
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--cw-bg);
      color: var(--cw-fg);
      border: 1px solid var(--cw-border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--cw-primary);
    }
    .cw-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--cw-card);
      border: 1px solid var(--cw-border);
      border-radius: 8px;
    }
    .cw-toggle-row .cw-toggle-label {
      font-weight: 500;
    }
    .cw-switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex: 0 0 38px;
    }
    .cw-switch input { display: none; }
    .cw-switch .cw-slider {
      position: absolute;
      inset: 0;
      background: var(--cw-idle);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .cw-switch .cw-slider::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .cw-switch input:checked + .cw-slider { background: var(--cw-primary); }
    .cw-switch input:checked + .cw-slider::before { transform: translateX(16px); }
    .cw-switch input:disabled + .cw-slider { cursor: not-allowed; opacity: 0.5; }
    .cw-recent-empty {
      color: var(--cw-muted);
      font-size: 12px;
      padding: 12px;
      text-align: center;
      border: 1px dashed var(--cw-border);
      border-radius: 6px;
    }
    .cw-recent-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 156px;
      overflow-y: auto;
    }
    .cw-recent-card {
      padding: 8px 10px;
      background: var(--cw-card);
      border: 1px solid var(--cw-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cw-recent-card-clickable {
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .cw-recent-card-clickable:hover {
      border-color: var(--cw-primary);
      background: var(--cw-bg);
    }
    .cw-recent-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--cw-fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cw-recent-meta {
      font-size: 11px;
      color: var(--cw-muted);
    }
    .cw-advanced summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--cw-muted);
      padding: 4px 0;
      user-select: none;
    }
    .cw-advanced summary::-webkit-details-marker { display: none; }
    .cw-advanced summary::before {
      content: "▶ ";
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .cw-advanced[open] summary::before {
      transform: rotate(90deg);
    }
    .cw-advanced-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 10px;
    }
    .cw-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .cw-row > input[type="text"] { flex: 1; }
    .cw-button {
      padding: 7px 12px;
      background: var(--cw-bg);
      color: var(--cw-fg);
      border: 1px solid var(--cw-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .cw-button:hover { border-color: var(--cw-primary); }
    .cw-button-inline {
      margin-top: 4px;
      align-self: flex-start;
    }
    .cw-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .cw-primary-button {
      width: 100%;
      padding: 10px 12px;
      background: var(--cw-primary);
      color: #ffffff;
      border: 1px solid var(--cw-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.15s ease, background 0.15s ease;
    }
    .cw-primary-button:hover:not(:disabled) { opacity: 0.9; }
    .cw-primary-button:disabled {
      background: var(--cw-idle);
      border-color: var(--cw-idle);
      color: var(--cw-muted);
      cursor: not-allowed;
    }
    .cw-slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cw-slider-row input[type="range"] {
      flex: 1;
    }
    .cw-slider-row .cw-slider-value {
      font-size: 12px;
      color: var(--cw-muted);
      min-width: 56px;
      text-align: right;
    }
    .cw-radio-group {
      display: flex;
      gap: 14px;
    }
    .cw-radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--cw-fg);
      font-size: 13px;
    }
    .cw-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cw-routing-block {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px dashed var(--cw-border);
    }
    .cw-route-sublabel {
      font-size: 11px;
      color: var(--cw-muted);
      margin-top: 6px;
    }
    .cw-route-select {
      margin-top: 2px;
    }
    .cw-template-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .cw-link-button {
      background: none;
      border: none;
      padding: 0;
      color: var(--cw-primary);
      font-size: 11px;
      cursor: pointer;
    }
    .cw-link-button:hover { text-decoration: underline; }
    .cw-template-preview {
      display: flex;
      gap: 4px;
      align-items: baseline;
      margin-top: 4px;
    }
    .cw-template-preview-text {
      color: var(--cw-fg);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 11px;
    }
    .cw-error-banner {
      display: none;
      padding: 8px 10px;
      background: rgba(255, 77, 79, 0.08);
      color: var(--cw-error);
      border: 1px solid rgba(255, 77, 79, 0.3);
      border-radius: 6px;
      font-size: 12px;
    }
    .cw-error-banner[data-visible="true"] { display: block; }
    .cw-hint {
      font-size: 11px;
      color: var(--cw-muted);
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <main class="cw-app">
    <header class="cw-header">
      <h1>剪贴板图片留存</h1>
      <span class="cw-version" id="cw-version">v1.5.4</span>
    </header>

    <section class="cw-status">
      <div class="cw-status-left">
        <span class="cw-dot" id="cw-status-dot" data-status="idle"></span>
        <span class="cw-status-text" id="cw-status-text">未运行</span>
      </div>
      <span class="cw-status-count" id="cw-status-count">今日已保存：0 张</span>
    </section>

    <div class="cw-error-banner" id="cw-error-banner"></div>

    <section class="cw-field">
      <label for="cw-folder" id="cw-folder-label"></label>
      <select id="cw-folder">
        <option value=""></option>
      </select>
      <span class="cw-hint" id="cw-folder-hint"></span>
    </section>

    <section class="cw-toggle-row">
      <span class="cw-toggle-label" id="cw-toggle-label"></span>
      <label class="cw-switch">
        <input type="checkbox" id="cw-enabled" disabled />
        <span class="cw-slider"></span>
      </label>
    </section>

    <section>
      <button type="button" class="cw-primary-button" id="cw-screenshot" disabled></button>
      <span class="cw-hint" id="cw-screenshot-hint"></span>
    </section>

    <section class="cw-field">
      <label id="cw-recent-label"></label>
      <div class="cw-recent-empty" id="cw-recent"></div>
    </section>

    <details class="cw-advanced" id="cw-advanced">
      <summary id="cw-advanced-summary"></summary>
      <div class="cw-advanced-body">
        <div class="cw-field">
          <label for="cw-interval" id="cw-interval-label"></label>
          <div class="cw-slider-row">
            <input type="range" id="cw-interval" min="0.5" max="5" step="0.5" value="1" />
            <span class="cw-slider-value" id="cw-interval-value"></span>
          </div>
          <span class="cw-hint" id="cw-interval-hint"></span>
        </div>

        <div class="cw-field">
          <label for="cw-tags" id="cw-tags-label"></label>
          <input type="text" id="cw-tags" placeholder="clipboard-watcher" />
        </div>

        <div class="cw-field">
          <div class="cw-template-header">
            <label for="cw-name-template" id="cw-name-template-label"></label>
            <button type="button" class="cw-link-button" id="cw-name-template-reset"></button>
          </div>
          <input type="text" id="cw-name-template" placeholder="" />
          <span class="cw-hint" id="cw-name-template-hint"></span>
          <span class="cw-hint cw-template-preview">
            <span id="cw-name-template-preview-label"></span>
            <span id="cw-name-template-preview" class="cw-template-preview-text"></span>
          </span>
        </div>

        <div class="cw-field">
          <label id="cw-duplicate-label"></label>
          <div class="cw-radio-group">
            <label>
              <input type="radio" name="cw-duplicate" value="skip" checked />
              <span id="cw-duplicate-skip-label"></span>
            </label>
            <label>
              <input type="radio" name="cw-duplicate" value="allow" />
              <span id="cw-duplicate-allow-label"></span>
            </label>
          </div>
          <span class="cw-hint" id="cw-duplicate-hint"></span>
          <button type="button" class="cw-button cw-button-inline" id="cw-reset-index" disabled></button>
          <span class="cw-hint" id="cw-reset-index-hint"></span>
        </div>

        <div class="cw-checkbox-row">
          <input type="checkbox" id="cw-notify" checked />
          <label for="cw-notify" id="cw-notify-label"></label>
        </div>

        <div class="cw-checkbox-row">
          <input type="checkbox" id="cw-mixed" checked />
          <label for="cw-mixed" id="cw-mixed-label"></label>
        </div>

        <div class="cw-checkbox-row">
          <input type="checkbox" id="cw-multi-file" />
          <label for="cw-multi-file" id="cw-multi-file-label"></label>
        </div>
        <span class="cw-hint" id="cw-multi-file-hint"></span>

        <div class="cw-field cw-routing-block">
          <label id="cw-routing-section-label"></label>
          <span class="cw-hint" id="cw-routing-section-hint"></span>

          <label for="cw-route-screenshot" class="cw-route-sublabel" id="cw-route-screenshot-label"></label>
          <select id="cw-route-screenshot" class="cw-route-select">
            <option value=""></option>
          </select>

          <label for="cw-route-clipboard" class="cw-route-sublabel" id="cw-route-clipboard-label"></label>
          <select id="cw-route-clipboard" class="cw-route-select">
            <option value=""></option>
          </select>

          <label for="cw-route-files" class="cw-route-sublabel" id="cw-route-files-label"></label>
          <select id="cw-route-files" class="cw-route-select">
            <option value=""></option>
          </select>
        </div>
      </div>
    </details>
  </main>

  <!-- 单文件 bundle：bundler 把 js/lib/* + plugin + ui 拼一起，规避 Eagle webview 的 require 限制（issue #2） -->
  <script src="js/bundle.js"></script>
</body>
</html>
