name: ✨ 想法 / Feature Request
description: 有想要的功能或改进？
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢提议。提交前先看一下 [docs/decisions.md](https://github.com/lc4t/copy2eagle/blob/dev/docs/decisions.md)，
        某些方向（如全局快捷键、来源 APP 识别、监听截图目录）已经在 ADR 里讨论过为什么不做。

  - type: textarea
    id: problem
    attributes:
      label: 这个想法要解决什么场景 / 痛点
      description: 不是"加 XX 功能"，而是"我在做 XX 的时候卡在哪里"
      placeholder: |
        我经常在 A 场景下需要 XX，但目前要做 N 步……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的体验（描述结果，不必描述实现）
      placeholder: |
        点开面板就能看到 X / 配置 Y 之后自动 Z
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 想过哪些替代方案
      description: 比如「我现在用 XXX 工具拼着用」/「考虑过加个开关 vs 加个按钮」
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 对你的优先级
      options:
        - 🔥 必须有，没有就不太用
        - 🌟 想要，会经常用
        - 💡 nice-to-have，偶尔用
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息（可选）
      description: 类似插件的截图 / 行业惯例 / 你愿意试制 PR 吗
    validations:
      required: false
